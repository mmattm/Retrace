<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Carrés — sin et cos</title>
  </head>
  <body>
    <div id="sketch-timeline">
      <iframe class="timeline-preview" title="Version du sketch" hidden></iframe>
      <section class="timeline-panel" id="timeline-panel" aria-label="Historique du sketch" aria-hidden="true" inert>
        <div class="timeline-rail">
          <div class="timeline-dots" aria-hidden="true"></div>
          <input type="range" min="0" step="1" aria-label="Version du sketch">
        </div>
        <div class="timeline-details" aria-live="polite">
          <button class="timeline-prompt" type="button" title="Copier une consigne pour partir de cette version"><span class="timeline-prompt-text"></span></button><time class="timeline-date"></time>
        </div>
      </section>
      <button class="timeline-toggle" type="button" aria-expanded="false" aria-controls="timeline-panel" title="Afficher ou masquer l’historique">
        <span class="timeline-chevron" aria-hidden="true"></span>
        <span class="timeline-count" aria-label="Version 0 sur 0">0/0</span>
      </button>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
